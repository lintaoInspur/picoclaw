name: Build RISC-V 64

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-riscv64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # PicoClaw 的 Web UI 需要前端构建后嵌入二进制，保留这三步
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: web/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      # 交叉编译 RISC-V 64 静态二进制
      - name: Build picoclaw for riscv64
        env:
          GOOS: linux
          GOARCH: riscv64
          CGO_ENABLED: '0'
        run: |
          go mod download
          go build -trimpath -ldflags="-s -w" -tags goolm  -o picoclaw_linux_riscv64 ./cmd/picoclaw

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: picoclaw_linux_riscv64
          path: picoclaw_linux_riscv64

      # 可选：打 tag 时自动发 Release，方便设备 wget 下载
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: picoclaw_linux_riscv64
